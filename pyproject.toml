[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "japan-dmv-arbitrage"
version = "1.0.0"
description = "Product Opportunity Intelligence Pipeline for Japan -> DMV small-batch resale market tests"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "commodity_analytics" }]
dependencies = [
    "pydantic>=2.5",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "rapidfuzz>=3.0",
    "openpyxl>=3.1",
    "typer>=0.12",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
browser = ["playwright>=1.40", "beautifulsoup4>=4.12", "selectolax>=0.3"]
trends = ["pytrends>=4.9"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
jdmv = "app.cli:app"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
